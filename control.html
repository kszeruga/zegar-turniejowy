<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Panel operatora — Zegar Turniejowy</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="shell"><header class="topbar"><a class="brand" href="./index.html">Zegar Turniejowy</a><nav><a href="./admin.html">Administracja</a><a href="./index.html">Ekran główny</a></nav></header>
<section id="authPanel" class="panel"><h1>Panel operatora</h1><p class="muted">Konto operatora jest aktywowane automatycznie po rejestracji.</p><form id="authForm" class="stack"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Hasło (min. 6 znaków)</label><input id="password" type="password" minlength="6" autocomplete="current-password" required><div class="row"><button class="primary" type="submit">Zaloguj</button><button class="secondary" type="button" id="registerButton">Utwórz konto</button><button class="secondary" type="button" id="resetPasswordButton">Resetuj hasło</button></div><p id="authStatus" class="status" role="status"></p></form></section>
<section id="pendingPanel" class="panel" hidden><h2>Konto oczekuje na zatwierdzenie</h2><p>Administrator musi zatwierdzić prośbę, zanim będzie można tworzyć i obsługiwać zegary.</p><p id="pendingStatus" class="status" role="status"></p><button id="pendingLogout" class="secondary">Wyloguj</button></section>
<section id="operatorPanel" hidden><div class="row"><h1>Zegary</h1><button id="logoutButton" class="secondary">Wyloguj</button></div><p id="accountInfo" class="muted"></p><section class="panel"><h2>Utwórz zegar</h2><form id="createForm" class="stack"><label for="timerName">Nazwa (np. Stolik 1)</label><input id="timerName" maxlength="100" required><div class="row"><div><label for="minutes">Minuty</label><input id="minutes" type="number" min="0" max="1440" value="5" required></div><div><label for="seconds">Sekundy</label><input id="seconds" type="number" min="0" max="59" value="0" required></div></div><button class="primary" type="submit">Utwórz zegar</button></form><p id="createStatus" class="status" role="status"></p></section><section class="panel"><h2 id="listHeading">Twoje zegary</h2><div id="timerList"></div></section></section></main><script type="module" src="./control.js"></script></body></html>
